<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Framework Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css?v=3" />
    <link rel="stylesheet" href="css/components.css?v=2" />
    <link rel="stylesheet" href="css/blocks.css?v=99" />
    <link rel="stylesheet" href="css/canvas.css?v=2" />
    <link rel="stylesheet" href="css/widgets.css?v=2" />
    <link rel="stylesheet" href="css/grids.css?v=2" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css"
    />
    <link rel="stylesheet" href="css/help.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23CDFE00'><rect width='8' height='8' x='2' y='2'/><rect width='8' height='8' x='14' y='2'/><rect width='8' height='8' x='2' y='14'/><rect width='8' height='8' x='14' y='14'/></svg>"
    />
  </head>
  <body>
    <!-- TOP BAR -->
    <div id="topbar">
      <div class="logo">Framework <span>Builder</span></div>
      <div class="tb-center">
        <div class="device-btns">
          <button
            class="dev-btn active"
            onclick="FB.canvas.setDevice('desktop', this)"
            title="Desktop"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <line x1="8" y1="21" x2="16" y2="21" />
              <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
          </button>
          <button
            class="dev-btn"
            onclick="FB.canvas.setDevice('tablet', this)"
            title="Tablet"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="4" y="2" width="16" height="20" rx="2" />
              <line x1="12" y1="18" x2="12" y2="18" />
            </svg>
          </button>
          <button
            class="dev-btn"
            onclick="FB.canvas.setDevice('mobile', this)"
            title="Mobile"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="5" y="2" width="14" height="20" rx="2" />
              <line x1="12" y1="18" x2="12" y2="18" />
            </svg>
          </button>
        </div>
        <button
          class="tb-hamburger"
          id="tb-hamburger"
          onclick="FB.panels.toggleMobileMenu()"
          title="Menu"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <div class="tb-center-items" id="tb-center-items">
          <div class="tb-sep"></div>
          <button
            class="tb-btn"
            onclick="FB.panels.toggleLeftPanel()"
            title="Toggle sidebar"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <button
            class="tb-btn"
            onclick="FB.panels.toggleRightPanel()"
            title="Toggle inspector"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
              />
              <path
                d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
              />
            </svg>
          </button>
          <div class="tb-sep"></div>
          <button
            class="tb-btn"
            onclick="FB.state.undo()"
            title="Undo (Ctrl+Z)"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="1 4 1 10 7 10" />
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
            </svg>
          </button>
          <button
            class="tb-btn"
            onclick="FB.state.redo()"
            title="Redo (Ctrl+Y)"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
          </button>
          <div class="tb-sep"></div>
          <button
            class="tb-btn"
            id="preview-btn"
            onclick="FB.canvas.togglePreview()"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span>Preview</span>
          </button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="FB.templates.save()" title="Save">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
              />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
            </svg>
            <span>Save</span>
          </button>
          <button
            class="tb-btn"
            onclick="FB.panels.openTemplateManager()"
            title="Load"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
              />
            </svg>
            <span>Load</span>
          </button>
          <div class="tb-sep"></div>
          <button
            class="tb-btn"
            onclick="FB.scraper.openImportDialog()"
            title="Import Website"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
              <circle cx="12" cy="12" r="0" />
            </svg>
            <span>Import</span>
          </button>
          <button
            class="tb-btn"
            onclick="FB.scraper.openAiImport()"
            title="AI Import"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M12 2a5 5 0 0 1 5 5c0 2.5-1.5 4.5-3 6l-2 3-2-3c-1.5-1.5-3-3.5-3-6a5 5 0 0 1 5-5z"
              />
              <circle cx="12" cy="6" r="1" />
            </svg>
            <span>AI</span>
          </button>
          <div class="tb-sep"></div>
          <button
            class="tb-btn"
            onclick="FB.canvas.clearCanvas()"
            style="color: #e88"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="3 6 5 6 21 6" />
              <path
                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
              />
              <line x1="10" y1="11" x2="10" y2="17" />
              <line x1="14" y1="11" x2="14" y2="17" />
            </svg>
            <span>Clear</span>
          </button>
          <div class="tb-sep"></div>
          <button
            class="tb-btn"
            onclick="FB.panels.openSettings()"
            title="Settings"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
          <button class="tb-btn" onclick="FB.help.open()" title="Help">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
          </button>
        </div>
      </div>
      <div class="tb-right">
        <button
          class="theme-toggle"
          id="theme-toggle-btn"
          onclick="FB.themeToggle.toggle()"
          title="Toggle dark/light mode"
        >
          <span id="theme-icon">☀</span>
        </button>
        <div class="lang-dropdown">
          <button
            class="lang-btn"
            id="lang-btn"
            onclick="FB.language.toggleMenu()"
          >
            <span id="lang-current-flag">🇬🇧</span>
            <span id="lang-current-code">EN</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          <div class="lang-menu" id="lang-menu"></div>
        </div>
        <div class="tb-export-wrap">
          <button class="tb-export" onclick="FB.panels.toggleExportMenu(event)">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              style="margin-right: 4px"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Export
          </button>
          <div class="tb-export-menu" id="export-menu">
            <button
              onclick="
                FB.export.open('html');
                FB.panels.toggleExportMenu();
              "
            >
              Export HTML
            </button>
            <button
              onclick="
                FB.export.open('react');
                FB.panels.toggleExportMenu();
              "
            >
              Export React
            </button>
            <button
              onclick="
                FB.export.open('tsx');
                FB.panels.toggleExportMenu();
              "
            >
              Export TSX
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="app">
      <!-- LEFT PANEL -->
      <div id="left-panel">
        <div class="lp-accordion">
          <div
            class="lp-acc-header"
            data-acc="layers"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">≋</span>
            <span class="lp-acc-label">Layers</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body" id="lp-body-layers">
            <div id="layers-list"></div>
          </div>
        </div>
        <div class="lp-accordion">
          <div
            class="lp-acc-header"
            data-acc="templates"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">⊞</span>
            <span class="lp-acc-label">Templates</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body" id="lp-body-templates">
            <div id="templates-panel"></div>
          </div>
        </div>
        <div class="lp-accordion">
          <div
            class="lp-acc-header"
            data-acc="blockthemes"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">◈</span>
            <span class="lp-acc-label">Block Themes</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body" id="lp-body-blockthemes">
            <div id="blockthemes-panel"></div>
          </div>
        </div>
        <div class="lp-accordion">
          <div
            class="lp-acc-header open"
            data-acc="sections"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">◆</span>
            <span class="lp-acc-label">Sections</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body open" id="lp-body-sections">
            <div id="block-library"></div>
          </div>
        </div>
        <div class="lp-accordion">
          <div
            class="lp-acc-header"
            data-acc="custom"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">■</span>
            <span class="lp-acc-label">Custom</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body" id="lp-body-custom">
            <div id="custom-block-library"></div>
            <div style="padding: 8px 6px">
              <button
                class="rp-btn"
                onclick="FB.canvas.insertBlock('textBlock')"
                style="width: 100%"
              >
                + Custom Text Block
              </button>
              <button
                class="rp-btn"
                onclick="FB.canvas.insertBlock('colorBlock')"
                style="width: 100%; margin-top: 4px"
              >
                + Colour Block
              </button>
            </div>
          </div>
        </div>
        <div class="lp-accordion">
          <div
            class="lp-acc-header"
            data-acc="layouts"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">☷</span>
            <span class="lp-acc-label">Layouts</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body" id="lp-body-layouts">
            <div id="layout-library"></div>
          </div>
        </div>
        <div class="lp-accordion">
          <div
            class="lp-acc-header"
            data-acc="widgets"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">▦</span>
            <span class="lp-acc-label">Widgets</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body" id="lp-body-widgets">
            <div id="widget-library"></div>
          </div>
        </div>

        <div class="lp-accordion">
          <div
            class="lp-acc-header"
            data-acc="ecommerce"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">🛒</span>
            <span class="lp-acc-label">Ecommerce</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body" id="lp-body-ecommerce">
            <div id="ecommerce-library"></div>
          </div>
        </div>

        <div class="lp-accordion">
          <div
            class="lp-acc-header"
            data-acc="veltro"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">⚡</span>
            <span class="lp-acc-label">Veltro Engine</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body" id="lp-body-veltro">
            <div id="veltro-library"></div>
          </div>
        </div>
        <div class="lp-accordion">
          <div
            class="lp-acc-header"
            data-acc="theme"
            onclick="FB.panels.toggleLeftAccordion(this)"
          >
            <span class="lp-acc-icon">◉</span>
            <span class="lp-acc-label">Theme &amp; Page</span>
            <span class="lp-acc-arrow">▶</span>
          </div>
          <div class="lp-acc-body" id="lp-body-theme">
            <div id="theme-panel-content"></div>
          </div>
        </div>
      </div>

      <!-- CANVAS -->
      <div id="canvas-column">
        <div id="page-tabs-bar"></div>
        <div id="canvas-wrap">
          <div id="canvas">
            <div id="drop-zones"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div id="right-panel">
        <div id="rp-content">
          <div class="rp-empty">
            <div class="rp-empty-icon">←</div>
            <div>Click a block to edit its styles</div>
          </div>
        </div>
      </div>
    </div>

    <!-- EXPORT MODAL -->
    <div id="modal-overlay">
      <div id="modal">
        <div class="modal-head">
          <h3 id="modal-title">Export Code</h3>
          <button class="modal-close" onclick="FB.export.close()">✕</button>
        </div>
        <div class="modal-tabs">
          <button
            class="modal-tab active"
            data-mode="html"
            onclick="FB.export.switchTab('html')"
          >
            HTML / CSS
          </button>
          <button
            class="modal-tab"
            data-mode="react"
            onclick="FB.export.switchTab('react')"
          >
            React JSX
          </button>
          <button
            class="modal-tab"
            data-mode="tsx"
            onclick="FB.export.switchTab('tsx')"
          >
            React TSX
          </button>
        </div>
        <div class="modal-body">
          <pre class="code-output" id="code-output"></pre>
        </div>
        <div class="modal-foot">
          <button class="tb-btn" onclick="FB.export.copyCode()">
            📋 Copy to Clipboard
          </button>
          <button class="tb-export" onclick="FB.export.downloadCode()">
            ⬇ Download
          </button>
          <button class="tb-btn" onclick="FB.export.close()">Close</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>
    <div id="fw-page-enter"></div>

    <script src="js/state.js?v=3"></script>
    <script src="js/pages.js?v=1"></script>
    <script src="js/blocks.js?v=99"></script>
    <script src="js/theme.js?v=1"></script>
    <script src="js/canvas.js?v=99"></script>
    <script src="js/panels.js?v=99"></script>
    <script src="js/export.js?v=3"></script>
    <script src="js/templates.js?v=2"></script>
    <script src="js/scraper.js?v=2"></script>
    <script src="js/widgets.js?v=2"></script>
    <script src="widgets/basic.js?v=2"></script>
    <script src="widgets/content.js?v=2"></script>
    <script src="widgets/media.js?v=2"></script>
    <script src="widgets/layout.js?v=4"></script>
    <script src="widgets/interactive.js?v=2"></script>
    <script src="widgets/gallery-like.js?v=2"></script>
    <script src="widgets/embed.js?v=2"></script>
    <script src="widgets/veltro.js?v=3"></script>
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js"></script>
    <script src="js/help.js"></script>
    <script src="js/app.js?v=3"></script>
    <script src="js/theme-toggle.js?v=1"></script>
    <script src="js/language.js?v=1"></script>
    <div id="google-translate-root" style="display: none"></div>
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            autoDisplay: false,
            includedLanguages:
              "af,sq,ar,hy,az,eu,be,bg,ca,zh-CN,zh-TW,hr,cs,da,nl,en,et,fi,fr,gl,ka,de,el,gu,ht,hi,hu,is,id,it,ja,kn,ko,lv,lt,mk,ms,ml,mr,ne,no,fa,pl,pt,ro,ru,sr,sk,sl,es,sw,sv,ta,te,th,tr,uk,ur,vi,cy",
          },
          "google-translate-root",
        );
      }
    </script>
    <script
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
    ></script>
  </body>
</html>
